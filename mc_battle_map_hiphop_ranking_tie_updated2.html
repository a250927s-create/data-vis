header {

  overflow: hidden;

  right: 28px;
  bottom: 10px;
  color: rgba(255,255,255,.06);
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 5px;
  transform: rotate(-5deg);
}

header h1 {
  position: relative;
  z-index: 1;
  margin: 0;
  font-size: clamp(25px, 4vw, 42px);
  font-weight: 900;
  letter-spacing: 3px;
  text-transform: uppercase;
  text-shadow: 4px 4px 0 #ff1744;
}

header p {
  position: relative;
  z-index: 1;
  margin: 10px 0 0;
  color: #d6d6d6;
  font-size: 14px;
  letter-spacing: 1.5px;
}

/* MAIN LAYOUT */
.container {
  display: grid;
  grid-template-columns: 330px 1fr;
  min-height: calc(100vh - 120px);
}

/* SIDEBAR */
.sidebar {
  padding: 25px;
  background:

      #111 8px,
      #151515 8px,

    );
  border-right: 2px solid #292929;
}

.sidebar h2 {
  margin: 0 0 25px;
  padding-bottom: 12px;
  font-size: 21px;
  letter-spacing: 2px;
  border-bottom: 2px solid #ff1744;
}

.sidebar h2::before {
  content: "◆ ";
  color: #ff1744;
}

.control {
  margin-bottom: 22px;
}

.control label {
  display: block;
  margin-bottom: 8px;
  color: #bbb;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

select {

  padding: 13px 14px;
  background: #0b0b0b;
  color: #fff;
  border: 1px solid #555;
  border-left: 4px solid #ff1744;
  border-radius: 2px;
  font-size: 14px;
  font-weight: 700;
  outline: none;
  transition: .2s;

select:hover,
select:focus {
  border-color: #ff1744;
  box-shadow: 0 0 14px rgba(255,23,68,.2);
}

/* STATS */
.stats {
  margin-top: 32px;
  padding-top: 22px;
  border-top: 1px dashed #555;
}

.stats-item {
  margin-bottom: 16px;
  padding: 13px 14px;
  background: rgba(0,0,0,.55);
  border-left: 4px solid #ffd000;
}

.stats-title {
  color: #999;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.2px;
}

.stats-value {
  margin-top: 4px;
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 1px;
}

/* MAP */
#map {
  width: 100%;
  height: calc(100vh - 120px);
  min-height: 600px;
  background: #090909;
}

/* LEGEND */
.legend {
  background: rgba(8,8,8,.94);
  padding: 14px 16px;
  line-height: 23px;
  color: #fff;
  border: 1px solid #555;
  border-left: 4px solid #ff1744;
  border-radius: 2px;
  box-shadow: 0 8px 30px rgba(0,0,0,.5);
}

.legend-title {
  font-weight: 900;
  margin-bottom: 7px;
  letter-spacing: 1px;
}

.legend i {
  width: 18px;
  height: 18px;
  float: left;
  margin: 2px 8px 0 0;
  opacity: .95;
}

.ranking-prefecture-link {
  color: #fff;
  text-decoration: none;
  cursor: pointer;
  transition: .2s ease;
}

.ranking-prefecture-link:hover {
  color: #ffd000;
  text-decoration: underline;
}

.popup-winner-list {
  max-height: 300px;
  overflow-y: auto;
  overflow-x: hidden;
  margin-top: 10px;
  padding: 8px 10px;
  border: 1px solid #ddd;
  background: #fff;
  box-sizing: border-box;
}

.popup-winner-list::-webkit-scrollbar {
  width: 7px;
}

.popup-winner-list::-webkit-scrollbar-track {
  background: #f1f1f1;
}

.popup-winner-list::-webkit-scrollbar-thumb {
  background: #999;
  border-radius: 4px;
}

.popup-winner-list::-webkit-scrollbar-thumb:hover {
  background: #666;
}

/* POPUP */
.popup {
  color: #111;
  min-width: 240px;
  font-family: Arial, sans-serif;
}

  margin-top: 0;
  padding-bottom: 8px;

  font-weight: 900;

.winner {
  padding: 9px 0;

}

.winner:last-child { border-bottom: none; }

.winner-name {
  font-weight: 900;
  font-size: 15px;
}

.winner-event {
  margin-top: 3px;
  font-size: 12px;
  color: #777;
}

  gap: 7px;
  margin-top: 10px;
  padding: 9px 14px;
  border-radius: 2px;
  background: #ff1744;
  color: #fff;
  text-decoration: none;
  font-weight: 900;
  font-size: 12px;
  letter-spacing: .5px;
  border: 1px solid #ff526f;
  box-shadow: 4px 4px 0 #111;

}

.battle-button:hover {
  background: #ffd000;
  color: #111;
  border-color: #ffd000;
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 #111;
}

.no-video {
  margin-top: 10px;
  color: #999;
  font-size: 12px;
}

/* MODAL */
.video-modal {
  display: none;
  position: fixed;
  z-index: 9999;
  inset: 0;
  background: rgba(0,0,0,.94);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.video-modal.active { display: flex; }

.video-modal-content {
  width: min(1000px, 95vw);
  background: #111;
  border: 2px solid #ff1744;
  border-radius: 2px;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(255,23,68,.18);

.video-modal-header {

  padding: 13px 16px;
  border-bottom: 1px solid #333;

.video-modal-title {
  font-weight: 900;
  letter-spacing: 1px;
}

.video-close {
  border: 0;

  color: #fff;
  width: 36px;
  height: 36px;
  border-radius: 2px;
  font-size: 22px;
  cursor: pointer;
}

.video-close:hover {
  background: #ffd000;
  color: #111;
}

.video-frame-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
}

.video-frame-wrap iframe {

  height: 100%;

.video-note {

const map = L.map("map", {
  zoomControl: true,
  attributionControl: false,
  minZoom: 5,
  maxZoom: 7
}).setView([36.2, 138.3], 5);


/*
  日本の都道府県GeoJSON

  ※GitHub上のGeoJSONを読み込み
*/

const geoJsonURL =
  "https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson";


let geoJsonLayer;


/* =========================================================
   色を決定
========================================================= */

function getColor(value) {

  if (value >= 10) {
    return "#8B0000";
  }

  if (value >= 7) {
    return "#DC143C";
  }

  if (value >= 4) {
    return "#FF8C00";
  }

  if (value >= 1) {
    return "#FFD700";
  }

  return "#333333";
}


/* =========================================================
   データ集計
========================================================= */

function getFilteredWinners() {

  const event =
    document.getElementById("eventSelect").value;

  const year =
    document.getElementById("yearSelect").value;

  return winners.filter(winner => {

    const eventMatch =
      event === "all" ||
      winner.event === event;

    const yearMatch =
      year === "all" ||
      winner.year.toString() === year;

    return eventMatch && yearMatch;

  });
}


/* =========================================================
   都道府県ごとの集計
========================================================= */

function aggregateData(data) {

  const result = {};

  data.forEach(winner => {

    if (!result[winner.prefecture]) {
      result[winner.prefecture] = [];
    }

    result[winner.prefecture].push(winner);

  });

  return result;
}


/* =========================================================
   ポップアップ作成
========================================================= */

function createPopup(prefecture, data) {

  let html = `
    <div class="popup">

      <h3>${prefecture}</h3>

      <strong>
        優勝回数：${data.length}回
      </strong>

      <hr>
      <div class="popup-winner-list">
  `;

  data.forEach(winner => {

    html += `
      <div class="winner">

        <div class="winner-name">
          ${winner.mc}
        </div>

        <div class="winner-event">
          ${winner.year}年 / ${winner.event}
        </div>

        ${
          winner.videoUrl
            ? `<a
                 class="battle-button"
                 href="${winner.videoUrl}"
                 target="_blank"
                 rel="noopener noreferrer">
                 ▶ YouTubeでバトルを見る
               </a>`
            : `<div class="no-video">動画リンク未登録</div>`
        }

      </div>
    `;

  });

  html += `</div></div>`;

  return html;
}


/* =========================================================
   地図更新
========================================================= */

function updateMap() {

  const data =
    getFilteredWinners();

  const aggregated =
    aggregateData(data);


  /*
    既存の地図を削除
  */

  if (geoJsonLayer) {
    map.removeLayer(geoJsonLayer);
  }


  /*
    GeoJSON読み込み
  */

  fetch(geoJsonURL)

    .then(response => response.json())

    .then(geojson => {

      geoJsonLayer =
        L.geoJSON(
          geojson,
          {

            style: function(feature) {

              /*
                GeoJSONの都道府県名
              */

              const prefecture =
                feature.properties.nam_ja ||
                feature.properties.name ||
                feature.properties.N03_001;

              const count =
                aggregated[prefecture]
                  ? aggregated[prefecture].length
                  : 0;


              return {

                fillColor:
                  getColor(count),

                weight: 1,

                color: "#666",

                fillOpacity: 0.75

              };

            },


            onEachFeature:
              function(feature, layer) {

                const prefecture =
                  feature.properties.nam_ja ||
                  feature.properties.name ||
                  feature.properties.N03_001;

                const data =
                  aggregated[prefecture] || [];


                layer.bindPopup(
                  createPopup(
                    prefecture,
                    data
                  )
                );


                layer.on({

                  mouseover:
                    function(e) {

                      e.target.setStyle({

                        weight: 3,

                        color: "#fff",

                        fillOpacity: 0.9

                      });

                    },


                  mouseout:
                    function(e) {

                      geoJsonLayer.resetStyle(
                        e.target
                      );

                    }

                });

              }

          }
        ).addTo(map);


      updateStatistics(
        data,
        aggregated
      );

    });

}


/* =========================================================
   統計情報更新
========================================================= */

function updateStatistics(
  data,
  aggregated
) {

  document.getElementById(
    "totalWinners"
  ).textContent =
    data.length;


  document.getElementById(
    "totalPrefectures"
  ).textContent =
    Object.keys(aggregated).length;


  // 優勝回数を多い順に並べ、TOP 3を表示
  const sortedRanking = Object.entries(aggregated)
    .map(([prefecture, winners]) => ({
      prefecture,
      count: winners.length
    }))
    .sort((a, b) => {
      if (b.count !== a.count) return b.count - a.count;
      return a.prefecture.localeCompare(b.prefecture, "ja");
    });

  // 同率は同じ順位にし、次の順位を繰り上げる。
  // 例：1位、1位、2位、3位、3位、4位…
  const ranking = [];
  let rank = 1;

  for (let i = 0; i < sortedRanking.length && rank <= 3; ) {
    const count = sortedRanking[i].count;

    const sameRankItems = sortedRanking.filter(
      item => item.count === count
    );

    sameRankItems.forEach(item => {
      ranking.push({
        ...item,
        rank
      });
    });

    rank += 1;
    i += sameRankItems.length;
  }

  // 3位までの順位に該当する都道府県だけ表示
  const displayRanking = ranking.filter(item => item.rank <= 3);

  const rankingElement = document.getElementById("topRanking");

  if (displayRanking.length === 0) {
    rankingElement.innerHTML = '<div class="ranking-empty">該当データなし</div>';
  } else {
    rankingElement.innerHTML = displayRanking.map(item => `
      <div class="ranking-row">
        <div class="rank-number rank-${item.rank}">
          ${item.rank}位
        </div>
        <div class="rank-prefecture">
          <a href="#" class="ranking-prefecture-link"
             data-prefecture="${item.prefecture}">
            ${item.prefecture}
          </a>
        </div>
        <div class="rank-count">
          ${item.count}回
        </div>
      </div>
    `).join("");
  }

}


/* =========================================================
   ランキングから都道府県へジャンプ
   ========================================================= */

function focusPrefecture(prefecture) {
  if (!geoJsonLayer) return;

  let targetLayer = null;

  geoJsonLayer.eachLayer(layer => {
    const name =
      layer.feature.properties.nam_ja ||
      layer.feature.properties.name ||
      layer.feature.properties.N03_001;

    if (name === prefecture) {
      targetLayer = layer;
    }
  });

  if (!targetLayer) return;

  map.fitBounds(targetLayer.getBounds(), {
    padding: [40, 40],
    maxZoom: 7,
    animate: true
  });

  targetLayer.setStyle({
    weight: 4,
    color: "#ffd000",
    fillOpacity: 1
  });

  targetLayer.bringToFront();
  targetLayer.openPopup();

  setTimeout(() => {
    if (geoJsonLayer) geoJsonLayer.resetStyle(targetLayer);
  }, 1400);
}

document.addEventListener("click", function(e) {
  const link = e.target.closest(".ranking-prefecture-link");
  if (!link) return;

  e.preventDefault();
  focusPrefecture(link.dataset.prefecture);
});


/* =========================================================
   フィルター変更
========================================================= */

document
  .getElementById("eventSelect")
  .addEventListener(
    "change",
    updateMap
  );


document
  .getElementById("yearSelect")
  .addEventListener(
    "change",
    updateMap
  );

      </div>

      </div>

      <div>
        <i style="background:#FFD700"></i>

      </div>

      <div>
        <i style="background:#333333"></i>

      </div>
