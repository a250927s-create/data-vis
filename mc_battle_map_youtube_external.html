    .stats-title {

    }

    .stats-value {
      font-size: 25px;

      padding: 12px;
      line-height: 22px;
      color: white;
      border-radius: 5px;
    }

    .legend-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .legend i {
      width: 18px;
      height: 18px;
      float: left;
      margin-right: 8px;
      opacity: 0.9;
    }

    /* ポップアップ */

      color: #111;
      min-width: 220px;
    }

    .popup h3 {
      margin-top: 0;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }

    .winner {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }

    .winner:last-child {
      border-bottom: none;
    }

    .winner-name {
      font-weight: bold;
    }

    .winner-event {
      font-size: 12px;
      color: #777;
    }

    .video-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .video-modal.active {
      display: flex;
    }

    .video-modal-content {
      width: min(1000px, 95vw);
      background: #181818;
      border: 1px solid #444;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);

    .video-modal-header {

      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 16px;
    }

    .video-modal-title {
      font-weight: bold;
      font-size: 16px;
    }

    .video-close {
      border: 0;
      background: #333;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
    }

    .video-close:hover {
      background: #555;
    }

    .video-frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-note {
      padding: 10px 16px 14px;
      color: #999;
      font-size: 12px;

/* =========================================================
   日本地図
========================================================= */

const map = L.map("map", {
  zoomControl: true,
  attributionControl: false
}).setView([36.2, 138.3], 5);


/*
  日本の都道府県GeoJSON

  ※GitHub上のGeoJSONを読み込み
*/

const geoJsonURL =
  "https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson";


let geoJsonLayer;


/* =========================================================
   色を決定
========================================================= */

function getColor(value) {

  if (value >= 10) {
    return "#8B0000";
  }

  if (value >= 7) {
    return "#DC143C";
  }

  if (value >= 4) {
    return "#FF8C00";
  }

  if (value >= 1) {
    return "#FFD700";
  }

  return "#333333";
}


/* =========================================================
   データ集計
========================================================= */

function getFilteredWinners() {

  const event =
    document.getElementById("eventSelect").value;

  const year =
    document.getElementById("yearSelect").value;

  return winners.filter(winner => {

    const eventMatch =
      event === "all" ||
      winner.event === event;

    const yearMatch =
      year === "all" ||
      winner.year.toString() === year;

    return eventMatch && yearMatch;

  });
}


/* =========================================================
   都道府県ごとの集計
========================================================= */

function aggregateData(data) {

  const result = {};

  data.forEach(winner => {

    if (!result[winner.prefecture]) {
      result[winner.prefecture] = [];
    }

    result[winner.prefecture].push(winner);

  });

  return result;
}


/* =========================================================
   ポップアップ作成
========================================================= */

function createPopup(prefecture, data) {

  let html = `
    <div class="popup">

      <h3>${prefecture}</h3>

      <strong>
        優勝回数：${data.length}回
      </strong>

      <hr>
  `;

  data.forEach(winner => {

    html += `
      <div class="winner">

        <div class="winner-name">
          ${winner.mc}
        </div>

        <div class="winner-event">
          ${winner.year}年 / ${winner.event}
        </div>

        ${
          winner.videoUrl
            ? `<a
                 class="battle-button"
                 href="${winner.videoUrl}"
                 target="_blank"
                 rel="noopener noreferrer">
                 ▶ YouTubeでバトルを見る
               </a>`
            : `<div class="no-video">動画リンク未登録</div>`
        }

      </div>
    `;

  });

  html += `</div>`;

  return html;
}


/* =========================================================
   地図更新
========================================================= */

function updateMap() {

  const data =
    getFilteredWinners();

  const aggregated =
    aggregateData(data);


  /*
    既存の地図を削除
  */

  if (geoJsonLayer) {
    map.removeLayer(geoJsonLayer);
  }


  /*
    GeoJSON読み込み
  */

  fetch(geoJsonURL)

    .then(response => response.json())

    .then(geojson => {

      geoJsonLayer =
        L.geoJSON(
          geojson,
          {

            style: function(feature) {

              /*
                GeoJSONの都道府県名
              */

              const prefecture =
                feature.properties.nam_ja ||
                feature.properties.name ||
                feature.properties.N03_001;

              const count =
                aggregated[prefecture]
                  ? aggregated[prefecture].length
                  : 0;


              return {

                fillColor:
                  getColor(count),

                weight: 1,

                color: "#666",

                fillOpacity: 0.75

              };

            },


            onEachFeature:
              function(feature, layer) {

                const prefecture =
                  feature.properties.nam_ja ||
                  feature.properties.name ||
                  feature.properties.N03_001;

                const data =
                  aggregated[prefecture] || [];


                layer.bindPopup(
                  createPopup(
                    prefecture,
                    data
                  )
                );


                layer.on({

                  mouseover:
                    function(e) {

                      e.target.setStyle({

                        weight: 3,

                        color: "#fff",

                        fillOpacity: 0.9

                      });

                    },


                  mouseout:
                    function(e) {

                      geoJsonLayer.resetStyle(
                        e.target
                      );

                    }

                });

              }

          }
        ).addTo(map);


      updateStatistics(
        data,
        aggregated
      );

    });

}


/* =========================================================
   統計情報更新
========================================================= */

function updateStatistics(
  data,
  aggregated
) {

  document.getElementById(
    "totalWinners"
  ).textContent =
    data.length;


  document.getElementById(
    "totalPrefectures"
  ).textContent =
    Object.keys(aggregated).length;


  let top =
    "-";


  let max =
    0;


  Object.entries(
    aggregated
  ).forEach(
    ([prefecture, winners]) => {

      if (
        winners.length > max
      ) {

        max =
          winners.length;

        top =
          prefecture +
          " " +
          winners.length +
          "回";

      }

    }
  );


  document.getElementById(
    "topPrefecture"
  ).textContent =
    top;

}


/* =========================================================
   フィルター変更
========================================================= */

document
  .getElementById("eventSelect")
  .addEventListener(
    "change",
    updateMap
  );


document
  .getElementById("yearSelect")
  .addEventListener(
    "change",
    updateMap
  );


/* =========================================================
   凡例
========================================================= */

const legend =
  L.control({
    position: "bottomright"
  });


legend.onAdd =
  function() {

    const div =
      L.DomUtil.create(
        "div",
        "legend"
      );


    div.innerHTML = `

      <div class="legend-title">
        優勝回数
      </div>

      <div>
        <i style="background:#8B0000"></i>
        10回以上
      </div>

      <div>
        <i style="background:#DC143C"></i>
        7～9回
      </div>

      <div>
        <i style="background:#FF8C00"></i>
        4～6回
      </div>

      <div>
        <i style="background:#FFD700"></i>
        1～3回
      </div>

      <div>
        <i style="background:#333333"></i>
        0回
      </div>

    `;


    return div;

  };


legend.addTo(map);


/* =========================================================
   初期表示
========================================================= */

updateMap();


</script>
